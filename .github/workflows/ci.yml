# Continuous integration: every push and pull request runs the same checks you
# run on your laptop, on a fresh GitHub machine. A step of the build is only
# done when this is green on its commit (CLAUDE.md, "How to work").
#
# Three jobs run side by side:
#   backend   pytest against Postgres + pgvector (a "service container")
#   frontend  TypeScript typecheck and the unit tests
#   e2e       the whole stack in Docker Compose, seeded with demo data, then
#             every Playwright walk-through; screenshots and traces are kept
#             as a downloadable artifact when one fails
name: CI

on:
  push:
  pull_request:

# A newer push to the same branch makes the older run pointless: cancel it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# The jobs only read the code. Nothing here can push, comment or release.
permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      db:
        # The same image as docker-compose.yml.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: motie
          POSTGRES_PASSWORD: ci-superuser-password
          POSTGRES_DB: motie
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U motie -d motie"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # Throwaway passwords: this database lives only for this job.
      POSTGRES_USER: motie
      POSTGRES_PASSWORD: ci-superuser-password
      POSTGRES_DB: motie
      MIGRATION_DB_PASSWORD: ci-owner-password
      APP_DB_PASSWORD: ci-app-password
      DATABASE_URL: postgresql+asyncpg://motie_app:ci-app-password@localhost:5432/motie
      MIGRATION_DATABASE_URL: postgresql+asyncpg://motie_owner:ci-owner-password@localhost:5432/motie
      JWT_SECRET: ci-only-secret-not-used-anywhere-else-0123456789
      APP_ENV: development
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Install the backend's packages
        run: pip install -r backend/requirements-dev.txt
      - name: Create the database users (motie_owner, motie_app)
        # The same script Postgres runs on a new dev volume; psql reaches the
        # service container through these two variables.
        env:
          PGHOST: localhost
          PGPASSWORD: ci-superuser-password
        run: bash db/init/10-db-users.sh
      - name: Run the backend tests
        working-directory: backend
        run: pytest -v

  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Write a .env for this run
        # Random passwords each run; APP_ENV=development lets the demo seed run.
        run: |
          {
            echo "POSTGRES_USER=motie"
            echo "POSTGRES_PASSWORD=$(openssl rand -hex 24)"
            echo "POSTGRES_DB=motie"
            echo "MIGRATION_DB_PASSWORD=$(openssl rand -hex 24)"
            echo "APP_DB_PASSWORD=$(openssl rand -hex 24)"
            echo "JWT_SECRET=$(openssl rand -hex 32)"
            echo "APP_ENV=development"
          } > .env
      - name: Build the images
        run: docker compose --profile tools build
      - name: Reset and seed the demo data
        # The same command as on your laptop: a fresh database, the dev users,
        # the fictional cases and the fictional register (S13 needs it).
        run: bash scripts/seed-demo.sh --yes --discard-history
      - name: Start the web app
        run: docker compose up -d web
      - name: Run the Playwright walk-throughs
        run: docker compose run --rm e2e
      - name: Show the app's logs
        if: failure()
        run: docker compose logs --no-color --tail 300 api web
      - name: Keep the Playwright report and screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/e2e/playwright-report/
            frontend/e2e/test-results/
          retention-days: 14
