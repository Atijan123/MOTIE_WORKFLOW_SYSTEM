# Continuous integration: every push runs the same checks you run on your
# laptop. A step of the build is only done when this is green on its commit
# (CLAUDE.md, "How to work").
#
# Where it runs (step 12i): on a self-hosted runner, your own Windows PC with
# Docker Desktop (docs/SELF-HOSTED-RUNNER.md). To run on GitHub's machines
# instead, set the repository variable CI_RUNS_ON to ubuntu-24.04
# (Settings > Secrets and variables > Actions > Variables): the steps are the same.
#
# Everything runs in Docker, as Compose project "motie-ci" with
# docker-compose.ci.yml on top: its own database and volumes, no host ports,
# production builds of the web apps. So it never touches your dev stack.
#
# Three jobs, one after the other on a single runner:
#   backend   pytest, in the tools container, against Postgres + pgvector
#   frontend  TypeScript typecheck and the unit tests (a Docker build step)
#   e2e       the whole stack, seeded with demo data, then every Playwright
#             walk-through; the report and screenshots are kept 7 days
# Each job ends by removing its containers, volumes and dangling images.
name: CI

# Pushes only, never pull requests: a pull request from someone else's fork
# would run its own code on your PC. (The repository is private as well.)
on:
  push:

permissions:
  contents: read

env:
  COMPOSE_PROJECT_NAME: motie-ci
  # Git Bash on Windows would otherwise rewrite /paths in arguments.
  MSYS_NO_PATHCONV: "1"

defaults:
  run:
    shell: bash

jobs:
  backend:
    # Only this repository's own pushes (a fork's copy of this file can't use your runner).
    if: github.repository == 'Atijan123/MOTIE_WORKFLOW_SYSTEM'
    runs-on: ${{ vars.CI_RUNS_ON || 'self-hosted' }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Prepare the CI stack
        run: bash scripts/ci-prepare.sh
      - name: Build the backend image
        run: docker compose build api
      - name: Run the backend tests
        run: docker compose run --rm tools pytest -q -p no:cacheprovider
      - name: Clean up
        if: always()
        run: bash scripts/ci-cleanup.sh

  frontend:
    if: github.repository == 'Atijan123/MOTIE_WORKFLOW_SYSTEM'
    runs-on: ${{ vars.CI_RUNS_ON || 'self-hosted' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Typecheck and unit tests
        run: docker build --target check --tag motie-ci/frontend-check frontend
      - name: Clean up
        if: always()
        run: bash scripts/ci-cleanup.sh

  office:
    # The office server's stack (docker-compose.office.yml, step 13c): built,
    # started and checked over https through Caddy's internal certificate authority.
    if: github.repository == 'Atijan123/MOTIE_WORKFLOW_SYSTEM'
    needs: [backend, frontend]
    runs-on: ${{ vars.CI_RUNS_ON || 'self-hosted' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Start the office stack and check it over https
        run: bash scripts/ci-office-smoke.sh
      - name: Clean up
        if: always()
        run: |
          docker image prune --force
          docker builder prune --force --filter until=168h

  e2e:
    if: github.repository == 'Atijan123/MOTIE_WORKFLOW_SYSTEM'
    needs: [backend, frontend]
    runs-on: ${{ vars.CI_RUNS_ON || 'self-hosted' }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Prepare the CI stack
        run: bash scripts/ci-prepare.sh
      - name: Build the images
        run: docker compose --profile tools build
      - name: Reset and seed the demo data
        # The same command as on your laptop, on CI's own database: the dev
        # users, the fictional cases and the fictional register (S13 needs it).
        run: bash scripts/seed-demo.sh --yes --discard-history
      - name: Start the applicant portal and the staff app
        run: docker compose up -d web staff
      - name: Run the Playwright walk-throughs
        run: docker compose run --rm e2e
      - name: Show the app's logs
        if: failure()
        run: docker compose logs --no-color --tail 300 api web staff
      - name: Keep the Playwright report and screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/e2e/playwright-report/
            frontend/e2e/test-results/
          retention-days: 7
      - name: Clean up
        if: always()
        run: bash scripts/ci-cleanup.sh
